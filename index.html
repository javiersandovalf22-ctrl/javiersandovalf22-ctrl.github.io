<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Javier Sandoval — Portafolio">
<meta property="og:description" content="Senior Creative Visual. Dirección de arte, campañas e identidades.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#111111">
<title>Javier Sandoval</title>
<meta name="description" content="Portafolio de Javier Sandoval, Senior Creative Visual. Dirección de arte, campañas e identidades.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&display=swap">
<style>
/* Layout: case studies oscuros como un estudio de branding. Medios protagonistas, tipografía fina, mucho aire. */
:root{
  --bg:#111111; --fg:#eeede9; --muted:#8a8984; --line:#262625; --brand:#0b3ef4;
  --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --gut:clamp(16px,2.6vw,40px); --space:clamp(72px,9vw,160px);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
figure{margin:0}
.wrap{padding-inline:var(--gut)}
:focus-visible{outline:1px solid var(--fg);outline-offset:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px var(--gut);background:rgba(17,17,17,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top a.nav{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:400;color:#cfcdc8;transition:color .3s}
.top a.nav:hover{color:#fff}
.top .r{justify-self:end}
.logo{height:20px;width:auto;display:block;color:var(--fg)}
.brandlink{justify-self:center;display:block;padding:4px}

.display{font-weight:300;font-size:clamp(30px,4.3vw,66px);line-height:1.06;letter-spacing:-.022em;margin:0;text-wrap:balance}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:400;color:var(--muted);margin:0}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:0 0 22px;font-weight:300}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}

#app.enter{animation:enter 1s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes enter{from{transform:translateY(24px)}to{transform:none}}

/* home */
.intro{padding-block:clamp(90px,12vw,190px) clamp(64px,7vw,110px)}
.intro .display{max-width:20ch}
.intro-sub{margin:26px 0 0;color:var(--muted);font-size:clamp(16px,1.3vw,19px)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(56px,6vw,96px) clamp(16px,2vw,28px)}
.tile{display:block}
.tile-frame{position:relative;overflow:hidden;aspect-ratio:16/10;background:#191918}
.tile-media{position:absolute;inset:0}
.tile-media img,.tile-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile-cap{display:flex;flex-wrap:wrap;gap:.15em .5em;align-items:baseline;padding-top:16px;font-size:clamp(16px,1.25vw,19px)}
.tile-name{color:var(--fg)}
.tile-line{color:var(--muted);transition:color .4s}
.tile:hover .tile-line{color:var(--fg)}
.work{padding-bottom:var(--space)}

.about{padding-block:0 var(--space)}
.about>.label{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:var(--gut)}
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:var(--gut)}
.about-lead{font-size:clamp(20px,2vw,30px);line-height:1.25;letter-spacing:-.012em;margin:0;max-width:26ch}
.cv{margin:0}
.cv-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.cv-row dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.cv-row dd{margin:0}
.cv-item{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px;padding:3px 0}
.brands{margin:0;max-width:52ch}

/* case */
.case-head{padding-block:clamp(90px,11vw,170px) clamp(40px,5vw,72px)}
.case-head .display{max-width:18ch}
.case-hero{display:flex;justify-content:center}
.case-hero>.blk{width:min(100%,1180px)}
.case-hero .img .zoom,.case-hero .video .zoom{aspect-ratio:16/9}
.case-hero img,.case-hero video{width:100%;height:100%;object-fit:cover}
.case-text-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-block:clamp(64px,7vw,120px) var(--space)}
.case-text{grid-column:2}
.case-text p{font-size:clamp(16px,1.25vw,19px);line-height:1.6;margin:0 0 1.1em;max-width:54ch;color:#d6d4cf}
.stats{display:flex;flex-wrap:wrap;gap:24px 56px;margin:28px 0 8px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat-n{font-size:clamp(40px,4.4vw,68px);font-weight:200;letter-spacing:-.03em;line-height:1}
.stat-l{color:var(--muted);font-size:14px;max-width:22ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--line)}
.meta dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.meta dd{margin:0;font-size:15px}

.case-body{display:flex;flex-direction:column;gap:var(--space);padding-bottom:var(--space)}
.blk{position:relative;width:100%;will-change:clip-path}
.zoom{overflow:hidden;width:100%;height:100%}
.zoom>img,.zoom>video{width:100%;height:auto;will-change:transform;transform-origin:50% 50%}
.blk.img{background:#191918;overflow:hidden}
.blk.img.contain .zoom{display:grid;place-items:center;aspect-ratio:1/1;padding:8%}
.blk.img.contain img{width:auto;max-width:100%;max-height:100%}
.blk.video{overflow:hidden;background:#000}
.blk.video video{width:100%;height:auto}
.breathe{display:flex;justify-content:center}
.photo{width:min(100%,880px);overflow:hidden}
.video.narrow{width:min(100%,980px)}
.sound{position:absolute;left:18px;bottom:18px;z-index:2;font:400 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(17,17,17,.55);border:1px solid rgba(255,255,255,.3);padding:10px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px)}
.sound[aria-pressed="true"]{background:#fff;color:#111}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2vw,28px);width:min(100%,1080px)}
.duo figure{overflow:hidden;background:#191918}
.duo .zoom img{height:100%;object-fit:cover}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px);width:min(100%,1000px)}
.reels figure{aspect-ratio:4/5;overflow:hidden;background:#000;border-radius:2px}
.reels video{width:100%;height:100%;object-fit:cover}

.field{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;gap:4%;padding:0 8%;overflow:hidden}
.field .piece{flex:1 1 0;min-width:0;display:grid;place-items:center;height:62%}
.field.n2 .piece{height:74%;flex:0 1 28%}
.field .piece img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}

.stage{aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}
.stage.tall{aspect-ratio:5/4}
.stage-in{display:grid;place-items:center;width:100%;height:100%}
.stage-in img{max-height:74%;max-width:56%;width:auto;height:auto;object-fit:contain}
.stage.wide .stage-in img{max-width:74%;max-height:70%}

.deck{aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}
.deck-in{position:relative;width:22%;aspect-ratio:4/5}
.deck-card{position:absolute;inset:0}
.deck-card img{width:100%;height:100%;object-fit:contain}

.hs{height:calc(100vh + var(--n) * 34vh)}
.hs-sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;overflow:hidden}
.hs-track{display:flex;gap:clamp(16px,2vw,28px);padding-inline:10vw;will-change:transform}
.hs-item{flex:none;overflow:hidden}
.hs-item img,.hs-item video{width:100%;height:100%;object-fit:cover}
.hs-item.sq{height:min(54vh,40vw);aspect-ratio:1/1}
.hs-item.poster{height:min(66vh,80vw);aspect-ratio:.68}
.hs-item.wide{height:min(52vh,44vw);aspect-ratio:16/9}
.hs-item.big{height:min(70vh,90vw);aspect-ratio:.82}
.hs-item.big img{object-fit:contain}

.stories-sec{height:calc(100vh + var(--n) * 26vh)}
.st-sticky{background:transparent}
.story{flex:none;position:relative;width:clamp(200px,21vw,310px);aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#222}
.st-media{position:absolute;inset:0}
.st-media img,.st-media video{width:100%;height:100%;object-fit:cover}
.st-media.contain img{object-fit:contain;padding:14% 7%}
.st-ui{position:absolute;inset:0 0 auto 0;padding:10px 10px 28px;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,0));color:#fff}
.st-bars{display:flex;gap:3px}
.st-bars i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.38);position:relative;overflow:hidden}
.st-bars i.done{background:#fff}
.st-bars i.run::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:bar 5s linear infinite}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.st-top{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;font-weight:400}
.st-av{width:24px;height:24px;border-radius:50%;border:1.5px solid #fff;flex:none}
.st-time{opacity:.7}
.st-x{margin-left:auto;font-size:20px;line-height:1;opacity:.9}

.mult{height:260vh}
.mult-sticky{position:sticky;top:0;height:100vh;overflow:hidden}
.mult-grid{position:absolute;display:grid;will-change:transform}
.mult-cell{height:var(--cellh,120px);overflow:hidden}
.mult-cell img{width:100%;height:100%;object-fit:cover}

.swatch{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.6vw,22px)}
.swatch figure{aspect-ratio:3/4;overflow:hidden}
.swatch img{width:100%;height:100%;object-fit:cover}

.scene{overflow:hidden;background:#191918}
.sc-holder{position:relative;will-change:transform}
.sc-holder img{width:100%;height:auto}
.sc-layer{position:absolute;inset:0}

.chapter p{font-size:clamp(22px,2.4vw,36px);letter-spacing:-.012em;line-height:1.15;margin:0;max-width:22ch}

.next{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:var(--gut);align-items:end;padding-block:var(--space);border-top:1px solid var(--line)}
.next .label{grid-column:1/-1}
.next-name{display:block;font-size:clamp(26px,3.2vw,48px);letter-spacing:-.02em;line-height:1.1}
.next-line{color:var(--muted);transition:color .4s}
.next:hover .next-line{color:var(--fg)}
.next-media{display:block;position:relative;aspect-ratio:16/10;overflow:hidden;background:#191918}

.foot{border-top:1px solid var(--line);padding-block:var(--space) 40px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--gut)}
.foot .display{font-size:clamp(28px,3.6vw,56px)}
.contact{display:flex;flex-direction:column;gap:18px;align-self:end}
.contact .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font-size:clamp(16px,1.3vw,20px)}
.contact .row span.v{user-select:all;word-break:break-all}
.copy{font:400 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;transition:border-color .3s}
.copy:hover{border-color:var(--fg)}
.small{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px;letter-spacing:.04em;padding-top:40px}

@media (max-width:820px){
  .tiles,.about-grid,.next,.foot,.case-text-wrap{grid-template-columns:minmax(0,1fr)}
  .case-text{grid-column:1}
  .cv-row{grid-template-columns:minmax(0,1fr);gap:8px}
  .cv-item{grid-template-columns:minmax(0,1fr) auto}
  .cv-item span:nth-child(2){grid-column:1;grid-row:2;font-size:14px}
  .duo,.reels{grid-template-columns:1fr 1fr}
  .reels figure:nth-child(3){display:none}
  .swatch{grid-template-columns:1fr 1fr}
  .field{aspect-ratio:4/5;flex-direction:column;padding:10% 18%}
  .field .piece,.field.n2 .piece{height:auto;flex:1 1 0;width:100%}
  .stage,.deck{aspect-ratio:4/5}
  .stage-in img{max-width:78%}
  .deck-in{width:40%}
  .story{width:62vw}
  .hs-item.sq{height:46vh}
}
@media (prefers-reduced-motion:reduce){ #app.enter{animation:none} .st-bars i.run::after{animation:none;transform:scaleX(1)} }

/* ---- landing ---- */
.home-hero{min-height:calc(100svh - 64px);display:flex;flex-direction:column;justify-content:space-between;padding-block:clamp(40px,6vw,80px) clamp(32px,4vw,56px)}
.mega{margin:0;font-weight:200;text-transform:uppercase;letter-spacing:-.045em;line-height:.86;font-size:clamp(64px,15.2vw,260px)}
.mega-line{display:block;overflow:hidden}
.mega-line:nth-child(2){text-align:right}
.mega-word{display:inline-block;animation:rise 1.4s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d)}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.home-sub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gut);align-items:end;font-size:clamp(15px,1.15vw,18px);margin-top:48px}
.home-sub p{margin:0;max-width:34ch}
.scroll-cue{justify-self:end;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--muted);padding-bottom:4px}
.work-head{display:flex;justify-content:space-between;padding-bottom:18px}
.index{border-top:1px solid #3a3a37}
.row{position:relative;display:grid;grid-template-columns:minmax(120px,.6fr) auto minmax(0,2fr);align-items:start;gap:20px;padding:clamp(14px,1.6vw,22px) 0;border-bottom:1px solid #3a3a37;overflow:hidden}
.row-meta{display:flex;gap:14px;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.row-title{grid-column:3;justify-self:end;text-align:right;text-transform:uppercase;font-weight:300;font-size:clamp(26px,4vw,64px);line-height:1;letter-spacing:-.025em;transform:translateY(var(--rise,0%));transition:color .5s,letter-spacing .7s cubic-bezier(.16,1,.3,1)}
.row-thumb{display:none}
.index.hovering .row .row-title{color:#5d5c58}
.index.hovering .row:hover .row-title{color:var(--fg);letter-spacing:-.01em}
.row:hover .row-meta{color:var(--fg)}
.pv{position:fixed;left:0;top:0;z-index:40;width:clamp(260px,24vw,380px);pointer-events:none;opacity:0;clip-path:inset(50% 0 50% 0);transition:clip-path .6s cubic-bezier(.16,1,.3,1),opacity .3s}
.pv.on{opacity:1;clip-path:inset(0 0 0 0)}
.pv-media{position:relative;aspect-ratio:16/10;overflow:hidden;background:#1b1b1a}
.cv-media{position:absolute;inset:0}
.cv-media img,.cv-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv-text{display:flex;flex-direction:column;gap:2px;padding:10px 0 0;font-size:13px;background:transparent}
.work{padding-bottom:var(--space)}
@media (hover:none),(max-width:820px){
  .pv{display:none}
  .row{grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
  .row-meta{grid-column:1/-1}
  .row-thumb{display:block;width:84px;aspect-ratio:16/10;position:relative;overflow:hidden;background:#1b1b1a}
  .row-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .row-title{grid-column:2;font-size:clamp(22px,6.4vw,34px)}
  .home-sub{grid-template-columns:minmax(0,1fr)}
  .scroll-cue{justify-self:start}
}
/* ---- bloques nuevos ---- */
.photo.wide{width:min(100%,1080px)}
.vduo figure{aspect-ratio:1/1;overflow:hidden;background:#111}
.vduo video{width:100%;height:100%;object-fit:cover}
.stackb{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,1.8vw,28px);padding:7% 10%;overflow:hidden}
.stackb .piece{width:100%}
.stackb .piece img{width:100%;height:auto}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.6vw,22px)}
.bars img{width:100%;height:auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px)}
.grid3 img{width:100%;height:auto}
.pouches{display:flex;align-items:flex-end;justify-content:center;gap:3%;aspect-ratio:16/9;padding:0 8% 7%;overflow:hidden}
.pouches .pouch{flex:0 1 19%}
.pouches .pouch img{width:100%;height:auto}
.field.n4 .piece{height:60%}
.field.n5{gap:2.4%;padding:0 5%}
.field.n5 .piece{height:66%}
.sc-panel{position:absolute;overflow:hidden;z-index:4}
.sc-strip{display:flex;flex-direction:column;height:100%;will-change:transform}
.sc-strip img{flex:none;width:100%;height:100%;object-fit:fill}
@media (max-width:820px){ .grid3{grid-template-columns:1fr 1fr} .bars{grid-template-columns:1fr} .pouches{aspect-ratio:4/5;flex-wrap:wrap;align-content:center;padding:8%} .pouches .pouch{flex:0 1 40%} .field.n5{flex-wrap:wrap} }

/* ---- índice desplegable ---- */
.row{display:block;padding:0;grid-template-columns:none}
.row-head{display:grid;grid-template-columns:minmax(120px,.6fr) minmax(0,2fr);align-items:start;gap:20px;padding:clamp(14px,1.6vw,22px) 0}
.row-title{grid-column:2}
.row-open{display:grid;grid-template-rows:0fr;transition:grid-template-rows .8s cubic-bezier(.16,1,.3,1)}
.row.open .row-open{grid-template-rows:1fr}
.row-open-in{overflow:hidden;display:grid;grid-template-columns:minmax(0,.6fr) minmax(0,1.4fr);gap:20px}
.row-media{grid-column:2;position:relative;aspect-ratio:16/8;overflow:hidden;background:#1b1b1a;margin-bottom:clamp(18px,2vw,28px);clip-path:inset(0 0 100% 0);transition:clip-path .9s cubic-bezier(.16,1,.3,1)}
.row.open .row-media{clip-path:inset(0 0 0 0)}
.row-media .cv-media img,.row-media .cv-media video{transform:scale(1.08);transition:transform 1.4s cubic-bezier(.16,1,.3,1)}
.row.open .row-media .cv-media img,.row.open .row-media .cv-media video{transform:none}
.row-info{grid-column:1;grid-row:1;align-self:end;display:flex;flex-direction:column;gap:10px;padding-bottom:clamp(18px,2vw,28px);font-size:14px;max-width:34ch}
.row-info p{margin:0}
.row-line{font-size:17px;color:var(--fg)}
.row-desc{color:#bdbbb6;line-height:1.5}
.row-go{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--muted);align-self:flex-start;padding-bottom:3px;margin-top:6px}
@media (max-width:820px){
  .row-head{grid-template-columns:minmax(0,1fr);gap:6px}
  .row-title{grid-column:1;justify-self:start;text-align:left}
  .row-open-in{grid-template-columns:minmax(0,1fr)}
  .row-media{grid-column:1;margin-bottom:14px}
  .row-info{grid-row:2}
}

/* ---- v3: animaciones automáticas ---- */
.cola{position:relative;aspect-ratio:16/9;overflow:hidden}
.cola-grid{position:absolute;display:grid;will-change:transform}
.cola-cell{height:var(--cellh,120px);overflow:hidden}
.cola-cell img{width:100%;height:100%;object-fit:cover}
.car{position:relative;overflow:hidden;padding-block:clamp(48px,7vw,110px)}
.car-track{display:flex;align-items:center;gap:clamp(18px,2.4vw,40px);width:max-content;will-change:transform}
.car-item{flex:none;height:min(62vh,74vw);transition:transform 1.2s cubic-bezier(.65,0,.25,1)}
.car-item img,.car-item video{height:100%;width:auto;display:block}
.car-item:not(.on){transform:scale(.88)}
.car.wide .car-item{height:min(48vh,46vw)}
.car-item.vid{aspect-ratio:16/9}
.car-item.vid video{width:100%;height:100%;object-fit:cover}
.seq{position:relative;aspect-ratio:16/9;overflow:hidden}
.seq-bg{position:absolute;inset:0;width:100%;height:100%}
.seq-layer{position:absolute;-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--f),#000 calc(100% - var(--f)),transparent);mask-image:linear-gradient(90deg,transparent,#000 var(--f),#000 calc(100% - var(--f)),transparent)}
.seq-layer:first-of-type{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - var(--f)),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - var(--f)),transparent)}
